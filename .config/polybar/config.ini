[bar/main]
bottom = true
width = 75%
height = 24
offset-x = 12.5%

background = #efefef
foreground = #575757

padding-left = 4
padding-right = 4
module-margin = 3

font-0 = "Poppins:style=Regular:size=8;3"
font-1 = "Font Awesome 7 Free:style=Solid:size=8;3"
font-2 = "Font Awesome 7 Free:style=Regular:size=8;3"

modules-left = xworkspaces
modules-center = xwindow
modules-right = wlan battery time

[module/xworkspaces]
type = internal/xworkspaces
icon-default = 
format = <label-state>

label-active = %icon%
label-active-foreground = #575757
label-active-padding = 1

label-occupied = %icon%
label-occupied-foreground = #b9b9b9
label-occupied-padding = 1

label-empty = %icon%
label-empty-foreground = #d4d4d4
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title%
label-maxlen = 48

[module/wlan]
type = internal/network
interface-type = wireless
format-connected = <label-connected>
label-connected = %{F#878787}%{F-}  %essid%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = %{F#878787}%{F-}  %percentage%%
label-muted = %{F#878787}%{F-}  Muted

[module/battery]
type = internal/battery
format-charging = <label-charging>
format-discharging = <label-discharging>
label-charging = %{F#878787}%{F-}  %percentage%%
label-discharging = %{F#878787}%{F-}  %percentage%%

[module/time]
type = internal/date
interval = 1
time = %H:%M
format = <label>
label = %{F#878787}%{F-}  %time%
