## description
style.name: verde
style.author: addy
style.date: 30 sep 26

## font
*.font: Poppins-8:medium

## wallpaper
background: solid
background.color: #d5edb9

## start menu
menu.itemHeight: 16
menu.titleHeight: 28
menu.title.justify: center
menu.title.Color: #ffc198
menu.title.textColor: #575757
menu.hilite.color: #a5e1e9
menu.hilite.textColor: #575757
menu.borderWidth: 0
menu.frame.justify: left
menu.frame.color: #efefef
menu.frame.textColor: #93a1a1
menu.frame.disableColor: #b3b3b3
menu.bullet: empty

## toolbar
toolbar.height: 24
toolbar.color: #efefef
toolbar.button.color: #efefef
toolbar.button.picColor: #575757
toolbar.workspace.justify: center
toolbar.workspace.color: #efefef
toolbar.workspace.textColor: #575757
toolbar.workspace.borderWidth: 0
toolbar.workspace.borderColor: #efefef
toolbar.iconbar.empty.color: #efefef
toolbar.iconbar.focused.Color: #efefef
toolbar.iconbar.focused.textColor: #575757
toolbar.iconbar.focused.borderColor: #efefef
toolbar.iconbar.focused.borderWidth: 0
toolbar.iconbar.focused.justify: center
toolbar.iconbar.unfocused.Color: #efefef
toolbar.iconbar.unfocused.textColor: #b3b3b3
toolbar.iconbar.unfocused.borderColor: #efefef
toolbar.iconbar.unfocused.borderWidth: 0
toolbar.iconbar.unfocused.justify: center
toolbar.systray.color: #efefef
toolbar.systray.borderWidth: 0
toolbar.systray.borderColor: #efefef
toolbar.clock.justify: center
toolbar.clock.color: #efefef
toolbar.clock.textColor: #575757
toolbar.clock.borderWidth: 0
toolbar.clock.borderColor: #efefef

## background behind titlebar color
window.justify: center
window.title.height: 32
window.title.focus.color: #ffc198
window.title.unfocus.color: #fbe8a4

## titlebar and its text color
window.label.focus.color: #ffc198
window.label.focus.textColor: #ffc198
window.label.unfocus.color: #fbe8a4
window.label.unfocus.textColor: #fbe8a4

## handlebar (bottom part of the window)
window.handleWidth: 4
window.handle.focus.color: #efefef
window.handle.unfocus.color: #efefef
window.grip.focus.color: #efefef
window.grip.unfocus.color: #efefef

## titlebar buttons
window.button.focus: solid
window.button.focus.color: #ffc198
window.button.focus.picColor: #ffc198
window.button.unfocus: solid
window.button.unfocus.color: #fbe8a4
window.button.unfocus.picColor: #fbe8a4
window.button.pressed: parentrelative

